<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>cAmiGo — conectando…</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚚</text></svg>">
<style>
    * { margin:0; padding:0; box-sizing:border-box }
    body {
        min-height:100dvh;
        display:flex; align-items:center; justify-content:center;
        background:#0f172a; color:#e2e8f0;
        font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
        padding:20px; text-align:center;
    }
    .tarjeta { max-width:420px; width:100% }
    .logo { font-size:56px; line-height:1 }
    h1 { font-size:1.25rem; margin:14px 0 6px }
    p   { font-size:.9rem; color:#94a3b8 }
    .spinner {
        width:44px; height:44px; margin:22px auto 10px;
        border:4px solid #1e293b; border-top-color:#38bdf8;
        border-radius:50%; animation:girar .8s linear infinite;
    }
    @keyframes girar { to { transform:rotate(360deg) } }
    #estado { font-size:.82rem; color:#64748b; min-height:2.4em; margin-top:8px }
    .error .spinner { display:none }
    .btn {
        display:none; margin:16px auto 0; padding:10px 26px;
        background:#38bdf8; color:#0f172a; font-weight:700;
        border:none; border-radius:999px; cursor:pointer;
        font-size:.9rem;
    }
    .error .btn { display:inline-block }
</style>
</head>
<body>
<div class="tarjeta" id="tarjeta">
    <div class="logo">🚚</div>
    <h1>cAmiGo</h1>
    <p>Buscando el servidor activo…</p>
    <div class="spinner"></div>
    <div id="estado"></div>
    <button class="btn" onclick="location.reload()">Reintentar</button>
</div>

<script>
(function () {
    'use strict';

    var FUENTE =
        'https://raw.githubusercontent.com/' +
        '007-SkyNet-007/camigo-app/main/' +
        'apk/servidores.json';

    var estado = document.getElementById('estado');
    var tarjeta = document.getElementById('tarjeta');

    function decir(txt) { estado.textContent = txt; }

    function probar(urlBase, ms) {
        return new Promise(function (resolver) {
            var controlador = new AbortController();
            var temporizador = setTimeout(
                function () { controlador.abort(); },
                ms || 4000);

            fetch(urlBase + '/api/Camiones', {
                method: 'GET',
                cache: 'no-store',
                signal: controlador.signal
            })
            .then(function (r) {
                clearTimeout(temporizador);
                resolver(r.ok);
            })
            .catch(function () {
                clearTimeout(temporizador);
                resolver(false);
            });
        });
    }

    function intentar() {
        decir('Consultando la lista de servidores…');

        fetch(FUENTE + '?t=' + Date.now(), {
            cache: 'no-store'
        })
        .then(function (r) {
            if (!r.ok) throw new Error('lista');
            return r.json();
        })
        .then(async function (cfg) {
            var servidores = cfg.servidores || [];

            if (!servidores.length) {
                fallar('No hay servidores registrados aún.');
                return;
            }

            for (var i = 0; i < servidores.length; i++) {
                var s = servidores[i];
                var url = String(s.url).replace(/\/+$/, '');

                decir('Probando ' + (s.nombre || ('servidor ' +
                    (i + 1))) + '…');

                if (await probar(url)) {
                    decir('Conectado con ' +
                        (s.nombre || 'servidor') +
                        '. Entrando…');
                    location.replace(url);
                    return;
                }
            }

            fallar('Ningún servidor responde ahora mismo. ' +
                   'Reintentamos automáticamente.');
        })
        .catch(function () {
            fallar('No pudimos leer la lista de servidores. ' +
                   'Reintentamos automáticamente.');
        });
    }

    function fallar(mensaje) {
        decir(mensaje);
        tarjeta.classList.add('error');
        setTimeout(intentar, 10000);
    }

    intentar();
})();
</script>
</body>
</html>
